name: Task 1 Runtime Certification


on:
  push:
    branches:
      - prototype/phase-1-vertical-slice
  workflow_dispatch:


permissions:
  contents: read


jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      RTS_TEST_MODE: '1'
      SUPABASE_PROJECT_ID: rts-phase1-prototype
      SUPABASE_URL: http://127.0.0.1:54321
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      AI_TEST_ADAPTER: fake


    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      - name: Install dependencies
        run: npm ci

