# Run full certification for each A1/A2 development update.
name: Task 1 Runtime Certification

on:
  push:
    branches:
      - prototype/phase-1-vertical-slice
      - fix/vercel-deploy-compat
      - review
      - review-db-candidate
      - dev/a1-a2-experience-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      RTS_TEST_MODE: '1'
      SUPABASE_PROJECT_ID: rts-phase1-prototype
      SUPABASE_URL: http://127.0.0.1:54321
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      AI_TEST_ADAPTER: fake

    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start designated local Supabase
        run: npx supabase start --workdir .

      - name: Load local Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(mktemp)"
          trap 'rm -f "$status_env"' EXIT
          npx supabase status --workdir . -o env > "$status_env"
          set -a
          source "$status_env"
          set +a
          test -n "${ANON_KEY:-}"
          printf 'SUPABASE_ANON_KEY=%s\n' "$ANON_KEY" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Native Vercel production build
        run: npm run build

      - name: Task 0 preview tests
        run: npm test

      - name: Harness safety tests
        run: npm run test:harness

      - name: Unit tests
        run: npm run test:unit

      - name: Source-contract tests
        run: node --test tests/*.test.mjs

      - name: Database integration tests
        run: npm run test:integration

      - name: PostgreSQL and RLS tests
        run: npm run test:db

      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Stop local Supabase with persisted state
        run: npx supabase stop --workdir .

      - name: Restart designated local Supabase with persisted state
        run: npx supabase start --workdir .

      - name: Actor resolver after persisted restart
        run: npx vitest run --config vitest.integration.config.ts tests/integration/00-task3-privilege-preflight.test.ts

      - name: PostgreSQL and RLS tests after persisted restart
        run: npm run test:db

      - name: Clean migration reset and reapply
        run: npx supabase db reset --local --workdir .

      - name: Actor resolver after clean migration reapply
        run: npx vitest run --config vitest.integration.config.ts tests/integration/00-task3-privilege-preflight.test.ts

      - name: PostgreSQL and RLS tests after clean migration reapply
        run: npm run test:db

      - name: Browser and visual-authority tests
        run: npm run test:e2e
      - name: Preserve Awaken viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awaken-viewport-screenshots
          path: |
            test-results/**/a1-*.png
            test-results/**/a2-*.png
            test-results/**/your-reactions-have-a-history-*.png
            test-results/**/formation-is-not-identity-*.png
            test-results/**/a3-completed-*.png
            test-results/**/a4-completed-*.png
          if-no-files-found: error
          retention-days: 14


      - name: Guided Deep Dive journey and historical isolation from clean database twice
        shell: bash
        env:
          RTS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_ANON_KEY"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          for repetition in 1 2; do
            npx supabase db reset --local --workdir .
            npx playwright test tests/e2e/current-journey.spec.ts tests/e2e/a1-finish.spec.ts tests/e2e/sc1-guided.spec.ts tests/e2e/sy2-guided.spec.ts tests/e2e/user-isolation.spec.ts
          done

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --workdir . --no-backup
