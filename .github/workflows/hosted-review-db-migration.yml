name: Hosted RTS Formation Review Database Migration

on:
  workflow_dispatch:
    inputs:
      certified_commit:
        description: Exact workflow commit that passed full certification
        required: true
        type: string
      migration_source_commit:
        description: Commit whose migration files are included unchanged in this certified commit
        required: true
        type: string
      expected_pending_migrations:
        description: Exact migration version suffix expected in the ledger (comma separated)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rts-formation-review-database-migration
  cancel-in-progress: false

jobs:
  migrate-review-database:
    name: Migrate and verify isolated review database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      EXPECTED_PENDING_MIGRATIONS: ${{ inputs.expected_pending_migrations }}

    steps:
      - name: Require the certified development commit and exact migration target
        env:
          CERTIFIED_COMMIT: ${{ inputs.certified_commit }}
          MIGRATION_SOURCE_COMMIT: ${{ inputs.migration_source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/work/a2-persistence" ]]; then
            echo 'Run this workflow from work/a2-persistence only.' >&2
            exit 1
          fi
          if [[ ! "$CERTIFIED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$CERTIFIED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'The supplied certified commit must exactly match this workflow run commit.' >&2
            exit 1
          fi
          if [[ ! "$MIGRATION_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The migration source commit must be a full Git SHA.' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_PENDING_MIGRATIONS" =~ ^[0-9]{12}(,[0-9]{12})*$ ]]; then
            echo 'Expected pending migrations must be a comma-separated list of 12-digit versions.' >&2
            exit 1
          fi

      - name: Check out selected certified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration sources match the supplied source commit
        env:
          MIGRATION_SOURCE_COMMIT: ${{ inputs.migration_source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$MIGRATION_SOURCE_COMMIT"
          git diff --exit-code "$MIGRATION_SOURCE_COMMIT" "$GITHUB_SHA" -- supabase/migrations

      - name: Determine baseline and exact pending migrations
        id: migration_plan
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs plan

      - name: Capture A1 review-data fingerprint
        id: a1_before
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs snapshot-a1

      - name: Audit pre-A2 schema and behavior before ledger bootstrap or A2
        if: ${{ steps.migration_plan.outputs.baseline_required == 'true' || steps.migration_plan.outputs.a2_pending == 'true' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs test-sql schema-audit scripts/hosted-pre-a2-audit.sql

      - name: Verify current A1 and A2 state before later migrations
        if: ${{ steps.migration_plan.outputs.a2_applied == 'true' && steps.migration_plan.outputs.pending_versions != '' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs test-sql hosted-test scripts/hosted-review-verification.sql

      - name: Bootstrap audited historical migration ledger once
        if: ${{ steps.migration_plan.outputs.baseline_required == 'true' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          BASELINE_VERSIONS: ${{ steps.migration_plan.outputs.baseline_versions }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=, read -r -a baseline_versions <<< "$BASELINE_VERSIONS"
          if [[ "${#baseline_versions[@]}" -lt 1 ]]; then
            echo 'The audited historical migration baseline is empty; refusing bootstrap.' >&2
            exit 1
          fi
          for version in "${baseline_versions[@]}"; do
            if [[ ! "$version" =~ ^[0-9]{12}$ ]]; then
              echo 'The migration plan returned an invalid baseline version.' >&2
              exit 1
            fi
          done
          echo "Recording ${#baseline_versions[@]} audited historical migrations as applied; migration SQL will not be replayed."
          node scripts/hosted-review-db-migration.mjs bootstrap-baseline

      - name: Recheck exact pending migration set
        id: confirmed_plan
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs plan

      - name: Apply only expected pending Supabase migrations
        if: ${{ steps.confirmed_plan.outputs.pending_versions != '' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs apply

      - name: Verify isolated A1 and A2 behavior, invalid IDs, and RLS
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs test-sql hosted-test scripts/hosted-review-verification.sql

      - name: Verify A1 review data is unchanged
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          A1_PROGRESS_FINGERPRINT: ${{ steps.a1_before.outputs.progress }}
          A1_REFLECTIONS_FINGERPRINT: ${{ steps.a1_before.outputs.reflections }}
        run: node scripts/hosted-review-db-migration.mjs verify-a1-snapshot

      - name: Verify migration ledger and forced RLS
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs verify

      - name: Report migration and verification result
        shell: bash
        run: |
          {
            echo '## RTS Formation review database migration'
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo '- Target: isolated review Supabase project `zxikzybpodxecgpkncix`'
            echo "- Pending at start: `${{ steps.migration_plan.outputs.pending_versions || 'none' }}`"
            echo "- Pending after application: `${{ steps.confirmed_plan.outputs.pending_versions || 'none' }}`"
            if [[ "${{ steps.migration_plan.outputs.baseline_required }}" == 'true' ]]; then
              echo '- Historical baseline: bootstrapped once after the pre-A2 audit passed; historical SQL was not replayed'
            else
              echo '- Historical baseline: already present; no history repair was run'
            fi
            if [[ -z "${{ steps.confirmed_plan.outputs.pending_versions }}" ]]; then
              echo '- Migration changes: none; exact no-op rerun'
            else
              echo '- Migration changes: expected pending migrations applied'
            fi
            echo '- A1 existing review data: unchanged'
            echo '- Isolated hosted verification and migration ledger checks: passed'
          } >> "$GITHUB_STEP_SUMMARY"
