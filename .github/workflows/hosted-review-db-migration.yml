name: Hosted RTS Formation Review Database Migration

on:
  push:
    branches:
      - review-db-candidate
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read
  statuses: write

concurrency:
  group: rts-formation-review-database-migration
  cancel-in-progress: false

jobs:
  migrate-review-database:
    name: Migrate and verify isolated review database
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require the candidate branch and exact workflow SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/review-db-candidate" ]]; then
            echo 'Hosted review migrations run only from review-db-candidate.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Checkout does not match the exact workflow commit.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture current review and discover candidate migrations
        id: introduced_migrations
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/review:refs/remotes/origin/review
          review_sha="$(git rev-parse refs/remotes/origin/review)"
          node scripts/hosted-review-db-migration.mjs candidate-migrations "$review_sha" "$GITHUB_SHA"

      - name: Require full certification for exact candidate SHA
        uses: actions/github-script@v7
        timeout-minutes: 40
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetSha = context.sha;
            const workflowId = 'task1-certification.yml';
            const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let attempt = 0; attempt < 70; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: targetSha,
                per_page: 100,
              });
              const runs = data.workflow_runs.filter((run) => run.head_sha === targetSha);
              const passed = runs.find((run) => run.status === 'completed' && run.conclusion === 'success');
              if (passed) {
                core.info(`Full certification passed for exact candidate SHA ${targetSha} (run ${passed.id}).`);
                return;
              }
              const active = runs.some((run) => run.status !== 'completed');
              const failed = runs.find((run) => run.status === 'completed');
              if (!active && failed) {
                core.setFailed(`Full certification for exact candidate SHA ${targetSha} ended with ${failed.conclusion}; database access is blocked.`);
                return;
              }
              core.info(`Waiting for full certification of exact candidate SHA ${targetSha} (check ${attempt + 1}/70).`);
              await delay(30000);
            }
            core.setFailed(`No successful full certification appeared for exact candidate SHA ${targetSha}; database access is blocked.`);

      - name: Confirm review branch has not moved since migration discovery
        shell: bash
        env:
          REVIEW_BASE_SHA: ${{ steps.introduced_migrations.outputs.review_base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/review:refs/remotes/origin/review
          current_review_sha="$(git rev-parse refs/remotes/origin/review)"
          if [[ "$current_review_sha" != "$REVIEW_BASE_SHA" ]]; then
            echo 'The review branch changed during candidate certification; refusing stale migration planning.' >&2
            exit 1
          fi

      - name: Determine baseline and exact pending migration set
        id: migration_plan
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
        run: node scripts/hosted-review-db-migration.mjs plan

      - name: Capture existing A1 review-data fingerprint
        id: a1_before
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs snapshot-a1

      - name: Audit baseline schema before ledger bootstrap
        if: ${{ steps.migration_plan.outputs.baseline_required == 'true' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs test-sql schema-audit scripts/hosted-pre-a2-audit.sql

      - name: Bootstrap audited historical migration ledger once
        if: ${{ steps.migration_plan.outputs.baseline_required == 'true' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
          BASELINE_VERSIONS: ${{ steps.migration_plan.outputs.baseline_versions }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=, read -r -a baseline_versions <<< "$BASELINE_VERSIONS"
          if [[ "${#baseline_versions[@]}" -lt 1 ]]; then
            echo 'The audited historical migration baseline is empty; refusing bootstrap.' >&2
            exit 1
          fi
          for version in "${baseline_versions[@]}"; do
            if [[ ! "$version" =~ ^[0-9]{12}$ ]]; then
              echo 'The migration plan returned an invalid baseline version.' >&2
              exit 1
            fi
          done
          echo "Recording ${#baseline_versions[@]} audited historical migrations as applied; historical SQL will not be replayed."
          node scripts/hosted-review-db-migration.mjs bootstrap-baseline

      - name: Recheck candidate pending migrations before apply
        id: confirmed_plan
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
        run: node scripts/hosted-review-db-migration.mjs plan

      - name: Apply only expected pending migrations
        if: ${{ steps.confirmed_plan.outputs.pending_versions != '' }}
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
        run: node scripts/hosted-review-db-migration.mjs apply

      - name: Verify isolated hosted behavior
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs test-sql hosted-test scripts/hosted-review-verification.sql

      - name: Plan the internal idempotency pass
        id: second_pass_plan
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
        run: node scripts/hosted-review-db-migration.mjs plan

      - name: Require zero migrations pending after the first pass
        env:
          PENDING_VERSIONS: ${{ steps.second_pass_plan.outputs.pending_versions }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PENDING_VERSIONS" ]]; then
            echo "Migrations remain pending after the first pass: $PENDING_VERSIONS" >&2
            exit 1
          fi
          echo 'No migrations remain pending after the second pass.'

      - name: Prove rerun is a no-op
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
        run: node scripts/hosted-review-db-migration.mjs apply

      - name: Repeat isolated hosted verification
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
        run: node scripts/hosted-review-db-migration.mjs test-sql hosted-test scripts/hosted-review-verification.sql

      - name: Verify existing A1 review data is unchanged
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          A1_PROGRESS_FINGERPRINT: ${{ steps.a1_before.outputs.progress }}
          A1_REFLECTIONS_FINGERPRINT: ${{ steps.a1_before.outputs.reflections }}
        run: node scripts/hosted-review-db-migration.mjs verify-a1-snapshot

      - name: Verify ledger, pending set, and forced RLS
        env:
          RTS_DATABASE_URL: ${{ secrets.RTS_DATABASE_URL }}
          EXPECTED_PENDING_MIGRATIONS: ${{ steps.introduced_migrations.outputs.versions }}
        run: node scripts/hosted-review-db-migration.mjs verify

      - name: Report candidate migration result
        shell: bash
        run: |
          {
            echo '## RTS Formation review database candidate'
            echo
            echo "- Exact candidate commit: `$GITHUB_SHA`"
            echo "- New migration versions against review: `${{ steps.introduced_migrations.outputs.versions || 'none' }}`"
            echo "- Pending at start: `${{ steps.migration_plan.outputs.pending_versions || 'none' }}`"
            echo "- Pending after second pass: `${{ steps.second_pass_plan.outputs.pending_versions || 'none' }}`"
            if [[ "${{ steps.migration_plan.outputs.baseline_required }}" == 'true' ]]; then
              echo '- Historical baseline: bootstrapped once after schema audit; historical SQL was not replayed'
            else
              echo '- Historical baseline: already present; no history repair was run'
            fi
            echo '- Second apply: no-op'
            echo '- Existing A1 review data: unchanged'
            echo '- Isolated hosted verification and exact migration ledger: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      # The review branch requires this exact-SHA status. Publish it only after
      # certification, hosted migration, and hosted verification have passed.
      # GitHub Actions must be the required status-check source in the ruleset.
      - name: Mark exact candidate as hosted verified
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: 'success',
              context: 'rts/hosted-review-verified',
              description: 'Certified and verified against the hosted review database',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Promote exact verified candidate to review
        uses: actions/github-script@v7
        env:
          REVIEW_BASE_SHA: ${{ steps.introduced_migrations.outputs.review_base_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetSha = context.sha;
            if (context.ref !== 'refs/heads/review-db-candidate') {
              core.setFailed('Promotion is allowed only from review-db-candidate.');
              return;
            }
            const [candidate, review] = await Promise.all([
              github.rest.repos.getBranch({ owner, repo, branch: 'review-db-candidate' }),
              github.rest.repos.getBranch({ owner, repo, branch: 'review' }),
            ]);
            if (candidate.data.commit.sha !== targetSha) {
              core.setFailed('Candidate branch moved after certification; review promotion is blocked.');
              return;
            }
            if (review.data.commit.sha !== process.env.REVIEW_BASE_SHA) {
              core.setFailed('Review branch moved after migration discovery; review promotion is blocked.');
              return;
            }
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/review',
              sha: targetSha,
              force: false,
            });
            core.info(`Promoted exact certified and hosted-verified candidate SHA ${targetSha} to review.`);
